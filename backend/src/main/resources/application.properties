# 8080 is taken by the Stonks app.
server.port=8081

# PostgreSQL. The password has no default: set ROGUE_DB_PASSWORD. Nothing connects until the
# database is first used, so the game runs without it.
spring.datasource.url=${ROGUE_DB_URL:jdbc:postgresql://localhost:5432/rogue_social}
spring.datasource.username=${ROGUE_DB_USER:postgres}
spring.datasource.password=${ROGUE_DB_PASSWORD:}

# MongoDB holds the social side: posts, replies, follows and likes. Like Postgres, nothing
# connects until it is first used. The short timeout makes a request fail in 2 seconds when
# Mongo is down, instead of the driver's default 30.
spring.data.mongodb.uri=${ROGUE_MONGO_URI:mongodb://localhost:27017/rogue_social?serverSelectionTimeoutMS=2000}

# Who is playing. There is no sign-in yet, so every run belongs to this user (see db/seed.sql).
rogue.player=laura

# Make browsers check for a newer page and sprites on every load, so a rebuilt frontend shows up
# on a normal refresh instead of an old cached copy.
spring.web.resources.cache.cachecontrol.no-cache=true
